name: Compile Experimental Candidate (no publication)

# Compatibility entrypoint. Use the same standard Sticky/provenance path as CI;
# never rewrite numeric versions from branch names or create RC tags/releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-validation:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
